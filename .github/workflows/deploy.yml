name: deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼

permissions:
  id-token: write # OIDC 토큰 발급 허용 (이게 없으면 역할을 못 빌림)
  contents: read

concurrency:
  group: deploy # 배포가 겹치지 않게 한 번에 하나씩
  cancel-in-progress: false

jobs:
  check:
    name: 문법 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JS 문법 검사
        run: |
          for f in app/js/*.js; do
            echo "checking $f"
            node --check "$f"
          done

  deploy:
    name: S3 업로드와 캐시 무효화
    needs: check # 검사를 통과해야 배포
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS 배포 역할 빌리기 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: S3 업로드
        run: aws s3 sync app/ "s3://${{ vars.SITE_BUCKET }}/" --delete

      - name: CloudFront 캐시 무효화
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.DISTRIBUTION_ID }}" --paths "/*"